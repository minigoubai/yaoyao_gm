<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d2040"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff88"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="#0a0a1a"/>
  <rect width="1200" height="720" fill="url(#chainGrad)" opacity="0.5"/>

  <!-- Title -->
  <text x="600" y="38" font-family="Arial Black, sans-serif" font-size="22" fill="#00d4ff" text-anchor="middle" font-weight="900">GIWA LOTTERY — SYSTEM ARCHITECTURE</text>
  <line x1="100" y1="52" x2="1100" y2="52" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>

  <!-- === PLAYER BROWSER === -->
  <rect x="30" y="80" width="220" height="160" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="140" y="102" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">PLAYER BROWSER</text>
  <!-- MetaMask icon box -->
  <rect x="50" y="115" width="180" height="40" rx="8" fill="#1e293b" stroke="#f6851b" stroke-width="1.5"/>
  <text x="140" y="138" font-family="Arial, sans-serif" font-size="12" fill="#f6851b" text-anchor="middle" font-weight="bold">🦊 MetaMask</text>
  <!-- DApp box -->
  <rect x="50" y="165" width="180" height="60" rx="8" fill="#1e293b" stroke="#00d4ff" stroke-width="1"/>
  <text x="140" y="183" font-family="Courier New, monospace" font-size="11" fill="#00d4ff" text-anchor="middle">index.html + ethers.js</text>
  <text x="140" y="200" font-family="Courier New, monospace" font-size="10" fill="#6b7280" text-anchor="middle">Web3Provider</text>

  <!-- Arrow: Browser to RPC -->
  <line x1="250" y1="160" x2="355" y2="160" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="302" y="152" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">eth_sendTransaction</text>

  <!-- === GIWA CHAIN === -->
  <rect x="370" y="80" width="460" height="560" rx="16" fill="#0d1f3c" stroke="#00d4ff" stroke-width="2"/>
  <text x="600" y="108" font-family="Arial Black, sans-serif" font-size="18" fill="#00d4ff" text-anchor="middle" filter="url(#glow)">⛓ GIWA CHAIN</text>
  <text x="600" y="126" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">GIWA Sepolia · Chain ID 91342 · EVM Paris</text>
  <line x1="390" y1="136" x2="810" y2="136" stroke="#00d4ff" stroke-width="1" opacity="0.2"/>

  <!-- === GIWA RPC === -->
  <rect x="395" y="148" width="180" height="50" rx="8" fill="#1e293b" stroke="#00d4ff" stroke-width="1"/>
  <text x="485" y="170" font-family="Courier New, monospace" font-size="11" fill="#00d4ff" text-anchor="middle">RPC: sepolia-rpc.giwa.io</text>

  <!-- === SMART CONTRACT BOX === -->
  <rect x="395" y="215" width="410" height="250" rx="12" fill="#0f1f35" stroke="#00ff88" stroke-width="2"/>
  <text x="600" y="240" font-family="Arial Black, sans-serif" font-size="15" fill="#00ff88" text-anchor="middle">📜 GiwaLotteryV4.sol</text>
  <text x="600" y="258" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Solidity 0.8.20 · OZ SafeMath · Reentrancy Guard</text>

  <!-- Contract Functions -->
  <rect x="415" y="272" width="175" height="38" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
  <text x="502" y="290" font-family="Courier New, monospace" font-size="11" fill="#60a5fa" text-anchor="middle">buyTickets(count)</text>
  <text x="502" y="304" font-family="Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">→ join pool</text>

  <rect x="610" y="272" width="175" height="38" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <text x="697" y="290" font-family="Courier New, monospace" font-size="11" fill="#fbbf24" text-anchor="middle">checkTimerExpiry()</text>
  <text x="697" y="304" font-family="Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">→ trigger draw</text>

  <rect x="415" y="323" width="370" height="38" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="600" y="341" font-family="Courier New, monospace" font-size="11" fill="#a78bfa" text-anchor="middle">_drawAndDistribute()  [private]</text>
  <text x="600" y="355" font-family="Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">→ pick winners · split pool · reset</text>

  <rect x="415" y="374" width="175" height="38" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
  <text x="502" y="392" font-family="Courier New, monospace" font-size="11" fill="#34d399" text-anchor="middle">_saveRoundRecord()</text>
  <text x="502" y="406" font-family="Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">→ store 24 rounds</text>

  <rect x="610" y="374" width="175" height="38" rx="6" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
  <text x="697" y="392" font-family="Courier New, monospace" font-size="11" fill="#f87171" text-anchor="middle">configure() [manager]</text>
  <text x="697" y="406" font-family="Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">→ set price/max/dur</text>

  <!-- Prize Pool Display -->
  <rect x="415" y="428" width="370" height="28" rx="6" fill="#1a2a1a" stroke="#00ff88" stroke-width="1"/>
  <text x="600" y="446" font-family="Arial, sans-serif" font-size="11" fill="#00ff88" text-anchor="middle">💰 PRIZE POOL  |  🥇50%  🥈25%  🥉15%  🔧10%</text>

  <!-- === RANDOMNESS BOX === -->
  <rect x="395" y="475" width="410" height="65" rx="10" fill="#1a0f2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="495" font-family="Arial, sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="bold">🎲 DETERMINISTIC RANDOMNESS</text>
  <text x="600" y="515" font-family="Courier New, monospace" font-size="11" fill="#c4b5fd" text-anchor="middle">seed = keccak256(abi.encode(blockhash(block.number), players, round))</text>
  <text x="600" y="532" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Locked at checkTimerExpiry() call — cannot be manipulated after the fact</text>

  <!-- === CRON JOB === -->
  <rect x="855" y="215" width="170" height="130" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
  <text x="940" y="240" font-family="Arial Black, sans-serif" font-size="13" fill="#fbbf24" text-anchor="middle">⏰ CRON JOB</text>
  <text x="940" y="258" font-family="Courier New, monospace" font-size="10" fill="#fbbf24" text-anchor="middle">*/5 * * * *</text>
  <text x="940" y="275" font-family="Courier New, monospace" font-size="10" fill="#9ca3af" text-anchor="middle">check_timer.js</text>
  <text x="940" y="295" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">↓ estimateGas()</text>
  <text x="940" y="312" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">↓ call checkTimerExpiry()</text>
  <text x="940" y="332" font-family="Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">No wallet needed</text>
  <!-- Arrow: Cron to Contract -->
  <line x1="855" y1="280" x2="805" y2="280" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: RPC to Contract -->
  <line x1="485" y1="198" x2="485" y2="212" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: Browser to Cron (dashed, indirect) -->
  <path d="M 250 210 Q 450 210 855 270" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow)"/>
  <text x="550" y="205" font-family="Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">anyone can trigger</text>

  <!-- === MANAGER WALLET === -->
  <rect x="855" y="365" width="170" height="70" rx="10" fill="#111827" stroke="#f87171" stroke-width="1.5"/>
  <text x="940" y="388" font-family="Arial, sans-serif" font-size="12" fill="#f87171" text-anchor="middle" font-weight="bold">👤 MANAGER</text>
  <text x="940" y="405" font-family="Courier New, monospace" font-size="9" fill="#6b7280" text-anchor="middle">0xC43943...403259</text>
  <text x="940" y="422" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• configure()</text>

  <!-- Arrow: Manager to Contract -->
  <line x1="940" y1="435" x2="940" y2="468" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- === BLOCK EXPLORER === -->
  <rect x="855" y="520" width="170" height="100" rx="12" fill="#111827" stroke="#6b7280" stroke-width="1.5"/>
  <text x="940" y="545" font-family="Arial Black, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">🔍 BLOCK EXPLORER</text>
  <text x="940" y="563" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">sepolia-explorer.giwa.io</text>
  <text x="940" y="582" font-family="Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">• View source code</text>
  <text x="940" y="597" font-family="Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">• Read contract state</text>
  <text x="940" y="612" font-family="Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">• Track transactions</text>
  <!-- Arrow: Contract to Explorer (subtle) -->
  <line x1="805" y1="600" x2="855" y2="570" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="830" y="610" font-family="Arial, sans-serif" font-size="9" fill="#374151" text-anchor="middle">verify</text>

  <!-- === FLOW LEGEND === -->
  <rect x="30" y="490" width="300" height="150" rx="10" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="50" y="515" font-family="Arial Black, sans-serif" font-size="12" fill="#9ca3af">FLOW LEGEND</text>

  <line x1="50" y1="538" x2="100" y2="538" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="110" y="542" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">User → Contract TX</text>

  <line x1="50" y1="560" x2="100" y2="560" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="110" y="564" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">Cron → Auto Draw</text>

  <line x1="50" y1="582" x2="100" y2="582" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="110" y="586" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">Draw Result Flow</text>

  <line x1="50" y1="604" x2="100" y2="604" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="110" y="608" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">Manager-Only</text>

  <line x1="50" y1="626" x2="100" y2="626" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="110" y="630" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">Verification</text>

  <!-- Auto-draw flow: step numbers -->
  <rect x="30" y="660" width="880" height="45" rx="10" fill="#0f1f35" stroke="#00d4ff" stroke-width="1"/>
  <text x="100" y="681" font-family="Arial, sans-serif" font-size="11" fill="#00d4ff" text-anchor="middle">① BUY TICKET</text>
  <text x="100" y="697" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0.001 ETH</text>
  <text x="260" y="681" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">② TIMER RUNS</text>
  <text x="260" y="697" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1 hour max</text>
  <text x="440" y="681" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">③ RANDOM SEEDED</text>
  <text x="440" y="697" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">blockhash locked</text>
  <text x="630" y="681" font-family="Arial, sans-serif" font-size="11" fill="#00ff88" text-anchor="middle">④ AUTO DRAW</text>
  <text x="630" y="697" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">no human needed</text>
  <text x="820" y="681" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">⑤ PRIZE SENT</text>
  <text x="820" y="697" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">to winners' wallets</text>

  <!-- Arrow between flow steps -->
  <line x1="155" y1="680" x2="195" y2="680" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="680" x2="350" y2="680" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="680" x2="540" y2="680" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="685" y1="680" x2="725" y2="680" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="870" y1="680" x2="900" y2="680" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
