<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIWA 抽奖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0e17;color:#e2e8f0;min-height:100vh}
header{background:#1a1f2e;border-bottom:1px solid #2d3748;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header h1{font-size:20px;color:#60a5fa}
.header-info{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#94a3b8}
header button{background:#2563eb;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
header button:hover{background:#1d4ed8}
.container{max-width:720px;margin:0 auto;padding:20px 16px}
.card{background:#1a1f2e;border:1px solid #2d3748;border-radius:12px;padding:20px;margin-bottom:16px}
.card-title{font-size:13px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.balance{font-size:28px;font-weight:700;color:#60a5fa}
.phase-banner{padding:12px 16px;border-radius:8px;text-align:center;font-size:15px;font-weight:600;margin-bottom:16px}
.phase-entry{background:#1e3a5f;color:#93c5fd}
.phase-draw{background:#3b2f6b;color:#c4b5fd}
.phase-complete{background:#1a3a2a;color:#86efac}
.timer{text-align:center;font-size:36px;font-weight:700;margin:16px 0;font-variant-numeric:tabular-nums;color:#fbbf24}
.timer-label{text-align:center;color:#64748b;font-size:13px;margin-bottom:8px}
.prize-pool{text-align:center;margin:12px 0}
.prize-pool .amount{font-size:24px;font-weight:700;color:#4ade80}
.prize-pool .label{font-size:12px;color:#64748b}
.input-row{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;background:#0f1520;border:1px solid #2d3748;color:#e2e8f0;padding:10px 14px;border-radius:8px;font-size:15px}
input:focus{outline:none;border-color:#60a5fa}
button.btn-primary{width:100%;background:#2563eb;color:#fff;border:none;padding:14px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
button.btn-primary:hover{background:#1d4ed8}
button.btn-primary:disabled{background:#1e3a5f;color:#64748b;cursor:not-allowed}
button.btn-secondary{background:#2d3748;color:#e2e8f0;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}
button.btn-secondary:hover{background:#3d4a5c}
.hint{font-size:12px;color:#64748b;text-align:center;margin-top:8px}
.players-list{max-height:200px;overflow-y:auto;margin-top:8px}
.player-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1e293b;font-size:13px}
.player-item .addr{font-family:monospace;color:#60a5fa}
.player-item .tickets{color:#94a3b8}
.winner-card{background:#1a3a2a;border:1px solid #22c55e;border-radius:8px;padding:16px;margin-top:12px;text-align:center}
.winner-card .prize{font-size:13px;color:#86efac;text-transform:uppercase;margin-bottom:4px}
.winner-card .address{font-size:15px;font-weight:700;color:#4ade80;font-family:monospace}
.winner-card .amount{font-size:18px;font-weight:700;color:#4ade80;margin-top:4px}
toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1f2e;border:1px solid #3b82f6;color:#e2e8f0;padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;display:none}
.status-bar{display:flex;justify-content:space-around;margin-top:12px;font-size:13px;color:#94a3b8}
.status-bar .val{font-weight:700;color:#e2e8f0}
.footer{text-align:center;color:#334155;font-size:12px;margin-top:32px;padding:16px}
a{color:#60a5fa;text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>🎰 GIWA Lottery</h1>
  <div class="header-info">
    <span id="networkBadge">GIWA Sepolia</span>
    <span id="roundBadge">Round 1</span>
  </div>
  <button id="walletBtn" onclick="connectWallet()">连接钱包</button>
  <button id="switchBtn" style="display:none" onclick="switchToGiwa()">切换网络</button>
</header>

<div class="container">
  <!-- 阶段横幅 -->
  <div id="phaseBanner" class="phase-banner phase-entry">🛒 购票中</div>

  <!-- 余额卡片 -->
  <div class="card">
    <div class="card-title">奖池金额</div>
    <div class="prize-pool">
      <div class="amount" id="poolAmount">0 ETH</div>
      <div class="label" id="ticketCount">0 张票 / 0 人</div>
    </div>
    <div class="timer-label">距离开奖</div>
    <div class="timer" id="timerDisplay">--:--:--</div>
    <div class="status-bar">
      <div>票价 <span class="val" id="ticketPriceDisplay">0.001 ETH</span></div>
      <div>最高 <span class="val" id="maxPlayersDisplay">50</span> 人</div>
    </div>
  </div>

  <!-- 购票区 -->
  <div class="card" id="buySection">
    <div class="card-title">购买抽奖券</div>
    <div class="input-row">
      <input type="number" id="ticketCountInput" min="1" max="50" value="1" placeholder="购买数量">
    </div>
    <button class="btn-primary" id="buyBtn" onclick="buyTickets()">购买抽奖券</button>
    <div class="hint" id="buyHint">票价 <span id="hintPrice">0.001</span> ETH × <span id="hintCount">1</span> 张 = <span id="hintTotal">0.001</span> ETH</div>
  </div>

  <!-- 开奖区 -->
  <div class="card" id="drawSection" style="display:none">
    <div class="card-title">🎉 开奖时间到！</div>
    <button class="btn-primary" id="triggerDrawBtn" onclick="triggerDraw()">🎰 触发开奖</button>
    <div class="hint">触发后无法撤回，请确认所有购票已完成</div>
  </div>

  <!-- 中奖结果 -->
  <div id="winnerSection" style="display:none">
    <div class="winner-card" id="winner1Card">
      <div class="prize">🥇 一等奖</div>
      <div class="address" id="winner1Addr">-</div>
      <div class="amount" id="winner1Amount">-</div>
    </div>
    <div class="winner-card" id="winner2Card" style="margin-top:8px">
      <div class="prize">🥈 二等奖</div>
      <div class="address" id="winner2Addr">-</div>
      <div class="amount" id="winner2Amount">-</div>
    </div>
    <div class="winner-card" id="winner3Card" style="margin-top:8px">
      <div class="prize">🥉 三等奖</div>
      <div class="address" id="winner3Addr">-</div>
      <div class="amount" id="winner3Amount">-</div>
    </div>
  </div>

  <!-- 参与玩家 -->
  <div class="card" id="playersCard">
    <div class="card-title">当前参与者 (<span id="playersCount">0</span>)</div>
    <div class="players-list" id="playersList"></div>
  </div>
</div>

<div class="footer">
  合约: <span id="contractAddr" style="font-family:monospace">-</span><br>
  <a href="https://sepolia.giwa.io" target="_blank">GIWA Sepolia 浏览器</a>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js?v=6"></script>
<script>
const CONTRACT = '0x4613Fb36Bc16F6Bf9bb27AeD9bfa9Cf7d3dEE959';
const CHAIN_ID = 91342;
const RPC = 'https://sepolia-rpc.giwa.io';

const ABI = [
  "function buyTickets(uint256 _count) payable",
  "function enter() payable",
  "function checkTimerExpiry()",
  "function triggerDraw()",
  "function getConfig() view returns (uint256,uint256,uint256,uint256,uint256,uint8,uint256,uint256)",
  "function getPlayers() view returns (address[])",
  "function getTicketCount(address) view returns (uint256)",
  "function getPrizePool() view returns (uint256)",
  "function getTotalTickets() view returns (uint256)",
  "function ticketPrice() view returns (uint256)",
  "function maxPlayers() view returns (uint256)",
  "function currentPhase() view returns (uint8)",
  "function endTime() view returns (uint256)",
  "function round() view returns (uint256)",
  "function MANAGER() view returns (address)",
  "event TicketsPurchased(address,uint256,uint256,uint256)",
  "event WinnersPicked(address,uint256,address,uint256,address,uint256)",
  "event PhaseChanged(uint8,uint8)",
  "event LotteryReset(uint256)"
];

let provider, signer, contract, account;
let readOnlyContract;
const PHASE_ENTRY = 0, PHASE_DRAW = 1;

function shortAddr(a) { return a ? a.slice(0,6)+'...'+a.slice(-4) : '-'; }
function fmtEth(v) { return (Number(v)/1e18).toFixed(4)+' ETH'; }
function fmtTime(ts) {
  if (!ts || ts <= 0) return '--:--:--';
  const now = Math.floor(Date.now()/1000);
  const diff = ts - now;
  if (diff <= 0) return '00:00:00';
  const h = Math.floor(diff/3600);
  const m = Math.floor((diff%3600)/60);
  const s = diff%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}

async function connectWallet() {
  if (!window.ethereum) { alert('请安装 MetaMask'); return; }
  try {
    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send('eth_requestAccounts', []);
    signer = provider.getSigner();
    account = await signer.getAddress();
    document.getElementById('walletBtn').textContent = shortAddr(account);
    await switchToGiwa();
    contract = new ethers.Contract(CONTRACT, ABI, signer);
    setupEventListeners();
    await loadData();
    provider.on('block', loadData);
  } catch(e) { showToast('连接失败: '+(e.message||'')); }
}

async function switchToGiwa() {
  const chainId = await window.ethereum.request({method:'eth_chainId'});
  if (parseInt(chainId) !== CHAIN_ID) {
    try {
      await window.ethereum.request({
        method: 'wallet_switchEthereumChain',
        params: [{chainId: '0x1652E'}]
      });
    } catch(e) {
      if (e.code===4902) {
        await window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [{chainId:'0x1652E',chainName:'GIWA Sepolia',rpcUrls:['https://sepolia-rpc.giwa.io'],blockExplorerUrls:['https://sepolia.giwa.io']}]
        });
      }
    }
  }
  document.getElementById('switchBtn').style.display = account ? 'inline-block' : 'none';
}

function initReadOnly() {
  const ro = new ethers.providers.JsonRpcProvider(RPC);
  // GIWA RPC requires 'from' in eth_call, patch call to inject dummy address
  const _origCall = ro.call.bind(ro);
  ro.call = async (request, network) => {
    if (request && !request.from) {
      request = { ...request, from: '0x0000000000000000000000000000000000000001' };
    }
    return _origCall(request, network);
  };
  readOnlyContract = new ethers.Contract(CONTRACT, ABI, ro);
  loadDataRO();
  setInterval(loadDataRO, 15000);
}

async function loadDataRO() {
  if (!readOnlyContract) return;
  try {
    const cfg = await readOnlyContract.getConfig();
    const [_price,,_dur,,_end,_phase,_tickets,_pool] = cfg;
    const phase = Number(_phase), tickets = Number(_tickets);
    const end = Number(_end), pool = Number(_pool);
    const round = Number(await readOnlyContract.round());

    document.getElementById('poolAmount').textContent = fmtEth(pool);
    document.getElementById('ticketCount').textContent = tickets + ' 张票 / 50 人';
    document.getElementById('roundBadge').textContent = 'Round ' + round;
    document.getElementById('contractAddr').textContent = shortAddr(CONTRACT);
    document.getElementById('hintPrice').textContent = (Number(_price)/1e18).toFixed(4);
    const nowSec = Math.floor(Date.now()/1000);
    document.getElementById('timerDisplay').textContent = end > 0 ? (nowSec >= end ? '已到期' : fmtTime(end)) : '∞';

    const banner = document.getElementById('phaseBanner');
    if (phase === PHASE_ENTRY) {
      if (end > 0 && nowSec >= end) {
        banner.className = 'phase-banner phase-draw';
        banner.textContent = '⏰ 时间已到，等待开奖';
        document.getElementById('buySection').style.display = 'none';
        document.getElementById('drawSection').style.display = 'block';
        document.getElementById('triggerDrawBtn').textContent = '⏰ 时间已到，请连接钱包触发';
        document.getElementById('triggerDrawBtn').disabled = true;
      } else {
        banner.className = 'phase-banner phase-entry';
        banner.textContent = '🛒 购票中';
        document.getElementById('buySection').style.display = 'block';
        document.getElementById('drawSection').style.display = 'none';
      }
    } else if (phase === PHASE_DRAW) {
      banner.className = 'phase-banner phase-draw';
      banner.textContent = '🎰 开奖中';
      document.getElementById('buySection').style.display = 'none';
      document.getElementById('drawSection').style.display = 'block';
    }

    const players = await readOnlyContract.getPlayers();
    document.getElementById('playersCount').textContent = players.length;
    const list = document.getElementById('playersList');
    list.innerHTML = '';
    const addrCount = {};
    players.forEach(p => addrCount[p] = (addrCount[p]||0)+1);
    Object.entries(addrCount).forEach(([p, cnt]) => {
      const div = document.createElement('div');
      div.className = 'player-item';
      div.innerHTML = '<span class="addr">'+shortAddr(p)+'</span><span class="tickets">'+cnt+' 张</span>';
      list.appendChild(div);
    });
  } catch(e) { console.error('loadDataRO error', e); }
}

async function loadData() {
  if (!contract) return;
  try {
    const cfg = await contract.getConfig();
    const [_price, _max, _dur, _start, _end, _phase, _tickets, _pool] = cfg;
    const price = Number(_price), max = Number(_max), phase = Number(_phase);
    const tickets = Number(_tickets), pool = Number(_pool), end = Number(_end);
    const round = Number(await contract.round());

    document.getElementById('poolAmount').textContent = fmtEth(pool);
    document.getElementById('ticketPriceDisplay').textContent = (price/1e18).toFixed(4)+' ETH';
    document.getElementById('maxPlayersDisplay').textContent = max;
    document.getElementById('ticketCount').textContent = tickets + ' 张票 / ' + max + ' 人';
    document.getElementById('roundBadge').textContent = 'Round ' + round;
    document.getElementById('contractAddr').textContent = shortAddr(CONTRACT);
    document.getElementById('hintPrice').textContent = (price/1e18).toFixed(4);

    // Timer
    if (end > 0) {
      if (Math.floor(Date.now()/1000) >= end) {
        document.getElementById('timerDisplay').textContent = '已到期';
      } else {
        document.getElementById('timerDisplay').textContent = fmtTime(end);
      }
    } else {
      document.getElementById('timerDisplay').textContent = '∞';
    }

    // Phase UI
    const nowSec = Math.floor(Date.now()/1000);
    const banner = document.getElementById('phaseBanner');
    if (phase === PHASE_ENTRY) {
      if (end > 0 && nowSec >= end) {
        banner.className = 'phase-banner phase-draw';
        banner.textContent = '⏰ 时间已到，等待开奖';
        document.getElementById('buySection').style.display = 'none';
        document.getElementById('drawSection').style.display = 'block';
        document.getElementById('triggerDrawBtn').disabled = false;
        document.getElementById('triggerDrawBtn').textContent = '🎰 触发开奖';
      } else {
        banner.className = 'phase-banner phase-entry';
        banner.textContent = '🛒 购票中';
        document.getElementById('buySection').style.display = 'block';
        document.getElementById('drawSection').style.display = 'none';
      }
    } else if (phase === PHASE_DRAW) {
      banner.className = 'phase-banner phase-draw';
      banner.textContent = '🎰 开奖中';
      document.getElementById('buySection').style.display = 'none';
      document.getElementById('drawSection').style.display = 'block';
      document.getElementById('winnerSection').style.display = 'none';
    }

    // Players list
    const players = await contract.getPlayers();
    document.getElementById('playersCount').textContent = players.length;
    const list = document.getElementById('playersList');
    list.innerHTML = '';
    const addrCount = {};
    players.forEach(p => addrCount[p] = (addrCount[p]||0)+1);
    Object.entries(addrCount).forEach(([p, cnt]) => {
      const div = document.createElement('div');
      div.className = 'player-item';
      div.innerHTML = `<span class="addr">${shortAddr(p)}</span><span class="tickets">${cnt} 张</span>`;
      list.appendChild(div);
    });

    // Check timer expiry automatically
    if (phase === PHASE_ENTRY && end > 0 && Math.floor(Date.now()/1000) >= end) {
      try {
        const tx = await contract.checkTimerExpiry();
        await tx.wait();
        showToast('定时开奖已触发');
      } catch(e) {}
    }

    // Update buy hint
    const cnt = parseInt(document.getElementById('ticketCountInput').value)||1;
    document.getElementById('hintCount').textContent = cnt;
    document.getElementById('hintTotal').textContent = ((price/1e18)*cnt).toFixed(4);

  } catch(e) { console.error('loadData error', e); }
}

async function buyTickets() {
  const btn = document.getElementById('buyBtn');
  const cnt = parseInt(document.getElementById('ticketCountInput').value)||1;
  btn.disabled = true; btn.textContent = '处理中...';
  try {
    const price = await contract.ticketPrice();
    const cost = price.mul(cnt);
    const tx = await contract.buyTickets(cnt, {value: cost});
    await tx.wait();
    showToast('购买成功！');
    await loadData();
  } catch(e) {
    showToast('购买失败: '+(e.code||'error'));
  }
  btn.disabled = false; btn.textContent = '购买抽奖券';
}

async function triggerDraw() {
  const btn = document.getElementById('triggerDrawBtn');
  btn.disabled = true; btn.textContent = '开奖中...';
  try {
    const tx = await contract.triggerDraw();
    await tx.wait();
    showToast('开奖完成！');
    await loadData();
  } catch(e) {
    showToast('开奖失败: '+(e.code||'error'));
    btn.disabled = false; btn.textContent = '🎰 触发开奖';
  }
}

function setupEventListeners() {
  if (!contract) return;
  contract.removeAllListeners('WinnersPicked');
  contract.removeAllListeners('LotteryReset');
  contract.on('WinnersPicked', (w1,p1,w2,p2,w3,p3) => {
    document.getElementById('winnerSection').style.display = 'block';
    document.getElementById('winner1Addr').textContent = shortAddr(w1);
    document.getElementById('winner1Amount').textContent = fmtEth(p1);
    document.getElementById('winner2Addr').textContent = shortAddr(w2);
    document.getElementById('winner2Amount').textContent = fmtEth(p2);
    document.getElementById('winner3Addr').textContent = shortAddr(w3);
    document.getElementById('winner3Amount').textContent = fmtEth(p3);
    document.getElementById('phaseBanner').className = 'phase-banner phase-complete';
    document.getElementById('phaseBanner').textContent = '✅ 开奖完成';
    document.getElementById('drawSection').style.display = 'none';
    showToast('🎉 开奖完成！');
  });

  contract.on('LotteryReset', (newRound) => {
    document.getElementById('winnerSection').style.display = 'none';
    loadData();
  });
}

// ticket count input update
document.getElementById('ticketCountInput').addEventListener('input', () => {
  try {
    const price = readOnlyContract ? null : null; // price only needed for display
    const cnt = parseInt(document.getElementById('ticketCountInput').value)||1;
    document.getElementById('hintCount').textContent = cnt;
    // Get price from DOM
    const priceText = document.getElementById('hintPrice').textContent;
    const priceVal = parseFloat(priceText) || 0.001;
    document.getElementById('hintTotal').textContent = (priceVal * cnt).toFixed(4);
  } catch(e) {}
});

// auto-refresh timer
setInterval(() => {
  const t = document.getElementById('timerDisplay');
  if (t.textContent && t.textContent !== '--:--:--') {
    const parts = t.textContent.split(':');
    if (parts.length===3) {
      let s = parseInt(parts[0])*3600+parseInt(parts[1])*60+parseInt(parts[2]);
      s = Math.max(0, s-1);
      t.textContent = String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    }
  }
}, 1000);

window.addEventListener('load', () => {
  if (window.ethereum) {
    connectWallet();
  }
  // 无钱包模式：通过 RPC 读取数据
  initReadOnly();
});
</script>
</body>
</html>
